kind = "mobile"
previewPath = "/"
title = "AutoApply - Job Application Assistant"
version = "1.0.0"
id = "artifacts/job-applier"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
localPort = 19097
name = "expo"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/job-applier run dev"

[services.env]
PORT = "19097"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/job-applier", "run", "build"]
run = ["pnpm", "--filter", "@workspace/job-applier", "run", "serve"]
