kind = "web"
previewPath = "/concrete-web/"
title = "Concrete Business Portal"
version = "1.0.0"
id = "artifacts/concrete-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/concrete-web/" ]
localPort = 20589

[services.development]
run = "pnpm --filter @workspace/concrete-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/concrete-web", "run", "build" ]
publicDir = "artifacts/concrete-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20589"
BASE_PATH = "/concrete-web/"
